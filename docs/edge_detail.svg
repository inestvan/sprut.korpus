<svg xmlns="http://www.w3.org/2000/svg" width="1662" height="870" viewBox="0 0 1662 870" font-family="Arial"><defs><marker id="ar" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M0,4.5 L9,1 L9,8 z" fill="#c0392b"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="32" font-size="26" font-weight="bold">Край корпуса со стороны разъёмов монитора</text><text x="26" y="58" font-size="16" fill="#555">Слева наружная стенка, справа внутрь корпуса. Вверху лицевая рамка, внизу задняя стенка.</text><text x="26" y="88" font-size="20" font-weight="bold">1. Разрез вне окна под кабели</text><text x="844.0" y="88" font-size="20" font-weight="bold">2. Разрез в окне под кабели</text><g transform="translate(26,96)"><rect x="99.0" y="69.3" width="198.0" height="159.5" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2.0" stroke-dasharray="8 5"/><rect x="66.0" y="66.0" width="33.0" height="616.0" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><rect x="99.0" y="649.0" width="693.0" height="33.0" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><rect x="264.0" y="228.8" width="22.0" height="420.2" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><polygon points="286.0,228.8 313.5,228.8 313.5,256.3 286.0,256.3" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><polygon points="286.0,256.3 313.5,256.3 286.0,283.8" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><rect x="297.0" y="69.3" width="495.0" height="159.5" fill="#1b1b1b" stroke="#000" stroke-width="1.0"/><text x="407.0" y="159.5" font-size="16" fill="#fff" text-anchor="start" font-weight="normal">монитор, торец</text><rect x="66.0" y="33.0" width="726.0" height="33.0" fill="#2f4f7a" stroke="#1b2f4d" stroke-width="1.2"/><rect x="264.0" y="66.0" width="22.0" height="27.5" fill="#2f4f7a" stroke="#1b2f4d" stroke-width="1.2"/><rect x="176.0" y="154.0" width="121.0" height="60.5" fill="#d33" stroke="#7a1010" stroke-width="1.4"/><text x="236.5" y="191.4" font-size="12" fill="#fff" text-anchor="middle" font-weight="normal">штекер</text><path d="M 187.0 184.8 C 126.5 264.0, 165.0 506.0, 418.0 561.0" stroke="#0a7" stroke-width="4.5" fill="none" stroke-dasharray="10 6"/><text x="429.0" y="572.0" font-size="15" fill="#0a7" text-anchor="start" font-weight="normal">кабель к Pi</text><line x1="99.0" y1="35.2" x2="297.0" y2="35.2" stroke="#c0392b" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="198.0" y="26.2" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="middle">18.0 мм свободно</text><line x1="27.5" y1="228.8" x2="27.5" y2="69.3" stroke="#c0392b" stroke-width="2.2" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="17.5" y="155.0" font-size="17" font-weight="bold" fill="#c0392b" text-anchor="end">14.5</text><text x="341.0" y="291.5" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">полка 2.5 мм с фаской 45°</text><line x1="330.0" y1="282.7" x2="303.6" y2="246.4" stroke="#c0392b" stroke-width="1.8"/><text x="341.0" y="396.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">внутренняя стенка 2 мм:</text><text x="341.0" y="440.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">верх на 41.2 — ниже монитора</text><line x1="330.0" y1="407.0" x2="280.5" y2="341.0" stroke="#c0392b" stroke-width="1.8"/><text x="341.0" y="11.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">ребро рамки 2.5 мм: держит монитор по X,</text><text x="341.0" y="55.0" font-size="15" fill="#c0392b" text-anchor="start" font-weight="normal">остаётся выше штекера</text><line x1="330.0" y1="18.7" x2="289.3" y2="79.2" stroke="#c0392b" stroke-width="1.8"/></g><g transform="translate(844.0,96)"><rect x="99.0" y="69.3" width="198.0" height="159.5" fill="#e9f7ec" stroke="#2e7d32" stroke-width="2.0" stroke-dasharray="8 5"/><rect x="66.0" y="66.0" width="33.0" height="616.0" fill="#8aa4bf" stroke="#2b3a4a" stroke-width="1.2"/><rect x="99.0" y="64